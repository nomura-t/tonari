[project]
name = "tonari"
version = "0.1.0"
description = "自分だけで使う、声で回す学びのアプリ（話題ごとに claude -p の opus を常駐、文字起こしは Apple と Scribe を整形役が突き合わせる）"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
